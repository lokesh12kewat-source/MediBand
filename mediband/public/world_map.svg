  {/* HUD Badges */}
  <g opacity="0.85">
    <text x="120" y="870" fill="#64748B" font-family="monospace" font-size="11" letter-spacing="1.5">GLOBAL MEDICINE ADHERENCE &amp; VERIFICATION NETWORK</text>
    <text x="120" y="888" fill="#FF6115" font-family="monospace" font-size="10.5" font-weight="700" letter-spacing="1">SYS_STATUS: ACTIVE · NODES: 14 GLOBAL HUBS · GS1 STANDARD ENFORCED</text>
