    <circle cx="1386" cy="372" r="18" fill="none" stroke="#FF6115" stroke-width="1.8" opacity="0.6" />
    <circle cx="1386" cy="372" r="10" fill="none" stroke="#FF6115" stroke-width="2.2" opacity="0.9" />
    <circle cx="1386" cy="372" r="6" fill="#FF6115" />
    <circle cx="1386" cy="372" r="2.8" fill="#FFFFFF" />
    <text x="1398" y="376" fill="#FFA066" font-family="system-ui, sans-serif" font-size="11" font-weight="700">Delhi (HQ)</text>

