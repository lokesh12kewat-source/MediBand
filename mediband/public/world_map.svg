<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 2000 1000" width="100%" height="100%">
  <defs>
    <radialGradient id="mapOceanGrad" cx="50%" cy="40%" r="75%">
      <stop offset="0%" stop-color="#111B2E" />
      <stop offset="50%" stop-color="#0B1220" />
      <stop offset="85%" stop-color="#070C16" />
      <stop offset="100%" stop-color="#040810" />
    </radialGradient>

    <linearGradient id="landGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#1E2E4A" />
      <stop offset="100%" stop-color="#142036" />
    </linearGradient>

    <linearGradient id="indiaGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#FF6115" stop-opacity="0.35" />
      <stop offset="100%" stop-color="#FF8A48" stop-opacity="0.18" />
    </linearGradient>

    <linearGradient id="mapArcGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#FF6115" stop-opacity="0.95" />
      <stop offset="50%" stop-color="#FFA066" stop-opacity="0.8" />
      <stop offset="100%" stop-color="#38BDF8" stop-opacity="0.9" />
    </linearGradient>

    <filter id="mapLineGlow" x="-30%" y="-30%" width="160%" height="160%">
      <feGaussianBlur stdDeviation="3.5" result="blur" />
      <feMerge>
        <feMergeNode in="blur" />
        <feMergeNode in="SourceGraphic" />
      </feMerge>
    </filter>

    <filter id="mapHubGlow" x="-60%" y="-60%" width="220%" height="220%">
      <feGaussianBlur stdDeviation="5" result="blur" />
      <feMerge>
        <feMergeNode in="blur" />
        <feMergeNode in="SourceGraphic" />
      </feMerge>
    </filter>

    <filter id="mapCoastGlow" x="-10%" y="-10%" width="120%" height="120%">
      <feGaussianBlur stdDeviation="2.5" result="blur" />
      <feMerge>
        <feMergeNode in="blur" />
        <feMergeNode in="SourceGraphic" />
      </feMerge>
    </filter>

    <pattern id="mapDotGrid" width="30" height="30" patternUnits="userSpaceOnUse">
      <circle cx="15" cy="15" r="1.2" fill="#38BDF8" opacity="0.25" />
    </pattern>
  </defs>

  {/* Base Ocean Canvas */}
  <rect width="2000" height="1000" fill="url(#mapOceanGrad)" />

  {/* Nautical Dot Grid */}
  <rect width="2000" height="1000" fill="url(#mapDotGrid)" />

  {/* Global Coordinate Graticules */}
  <g stroke="#38BDF8" stroke-width="1" stroke-dasharray="4,8" opacity="0.22">
    <line x1="50" y1="200" x2="1950" y2="200" />
    <line x1="50" y1="350" x2="1950" y2="350" />
    <line x1="50" y1="500" x2="1950" y2="500" stroke="#38BDF8" stroke-width="1.8" stroke-dasharray="8,6" opacity="0.45" />
    <line x1="50" y1="650" x2="1950" y2="650" />
    <line x1="50" y1="800" x2="1950" y2="800" />

    <line x1="250" y1="50" x2="250" y2="950" />
    <line x1="500" y1="50" x2="500" y2="950" />
    <line x1="750" y1="50" x2="750" y2="950" />
    <line x1="1000" y1="50" x2="1000" y2="950" stroke="#38BDF8" stroke-width="1.8" stroke-dasharray="8,6" opacity="0.45" />
    <line x1="1250" y1="50" x2="1250" y2="950" />
    <line x1="1500" y1="50" x2="1500" y2="950" />
    <line x1="1750" y1="50" x2="1750" y2="950" />
  </g>

