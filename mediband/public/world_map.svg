  <g filter="url(#mapCoastGlow)">
    {/* North America */}
    <polygon points="160,209 175,183 225,183 300,192 350,187 425,192 525,178 600,174 590,209 675,241 725,268 700,294 670,303 645,312 625,330 600,357 595,388 575,370 550,366 515,384 515,411 560,429 585,455 615,464 595,464 575,446 540,429 500,420 475,397 450,393 425,366 400,348 380,330 380,285 350,259 320,236 275,232 225,241 175,232 160,209" fill="url(#landGrad)" stroke="#60A5FA" stroke-width="2" opacity="0.95" />
    {/* Greenland */}
    <polygon points="775,232 825,209 875,187 900,156 850,129 775,129 725,142 700,165 750,209 775,232" fill="url(#landGrad)" stroke="#60A5FA" stroke-width="1.8" opacity="0.95" />
    {/* South America */}
    <polygon points="615,464 640,451 690,455 750,500 825,522 825,545 810,581 790,603 750,634 725,657 675,701 660,741 630,733 625,701 640,670 645,634 620,581 600,522 600,491 615,464" fill="url(#landGrad)" stroke="#60A5FA" stroke-width="2" opacity="0.95" />
    {/* Europe */}
    <polygon points="955,339 955,308 995,303 980,285 1010,272 1040,259 1040,241 1075,250 1100,232 1140,209 1125,183 1160,187 1200,201 1250,196 1300,196 1300,277 1250,285 1200,299 1175,294 1150,294 1140,317 1115,330 1080,321 1060,303 1015,312 985,339 955,339" fill="url(#landGrad)" stroke="#60A5FA" stroke-width="2" opacity="0.95" />
    {/* British Isles */}
    <polygon points="975,277 995,272 1005,263 1000,241 985,241 975,254 975,277" fill="url(#landGrad)" stroke="#60A5FA" stroke-width="1.8" opacity="0.95" />
    {/* Africa */}
    <polygon points="970,339 1050,335 1125,357 1170,361 1175,379 1215,446 1255,446 1240,478 1200,522 1175,567 1160,625 1140,652 1090,652 1060,589 1045,522 1040,482 1010,473 960,482 925,446 915,433 915,406 935,375 970,339" fill="url(#landGrad)" stroke="#60A5FA" stroke-width="2" opacity="0.95" />
    {/* Madagascar */}
    <polygon points="1220,554 1250,567 1240,612 1220,612 1220,554" fill="url(#landGrad)" stroke="#60A5FA" stroke-width="1.8" opacity="0.95" />
    {/* Asia / Eurasia */}
    <polygon points="1300,196 1350,174 1425,165 1525,151 1650,178 1800,187 1900,205 1850,232 1775,254 1710,277 1675,299 1650,330 1610,330 1600,357 1590,393 1540,402 1525,455 1500,491 1490,455 1450,402 1400,429 1400,464 1385,464 1360,411 1340,393 1310,388 1280,384 1270,393 1250,433 1215,446 1175,379 1175,344 1200,321 1250,285 1300,277 1300,196" fill="url(#landGrad)" stroke="#60A5FA" stroke-width="2" opacity="0.95" />
    {/* Japan */}
    <polygon points="1650,357 1675,344 1700,321 1725,303 1710,299 1690,330 1650,357" fill="url(#landGrad)" stroke="#60A5FA" stroke-width="1.8" opacity="0.95" />
    {/* Southeast Asia */}
    <polygon points="1475,478 1525,522 1575,536 1600,536 1575,509 1525,500 1475,478" fill="url(#landGrad)" stroke="#60A5FA" stroke-width="1.8" opacity="0.95" />
    <polygon points="1550,513 1590,478 1575,469 1545,491 1550,513" fill="url(#landGrad)" stroke="#60A5FA" stroke-width="1.8" opacity="0.95" />
    {/* Australia */}
    <polygon points="1570,598 1600,567 1675,554 1710,545 1730,581 1765,625 1750,661 1690,657 1650,643 1575,652 1570,625 1570,598" fill="url(#landGrad)" stroke="#60A5FA" stroke-width="2" opacity="0.95" />
    {/* New Zealand */}
    <polygon points="1840,706 1870,683 1890,665 1875,657 1860,679 1840,706" fill="url(#landGrad)" stroke="#60A5FA" stroke-width="1.8" opacity="0.95" />
  </g>

  {/* India Neon Orange Highlight */}
  <g id="indiaHighlight">
    <polygon points="1340,393 1360,411 1370,433 1385,464 1400,464 1400,442 1425,420 1445,402 1460,406 1440,379 1400,366 1370,357 1360,375 1340,393" fill="url(#indiaGrad)" stroke="#FF6115" stroke-width="2.8" filter="drop-shadow(0 0 14px rgba(255, 97, 21, 0.75))" />
    <circle cx="1405" cy="484" r="7" fill="#FF6115" fill-opacity="0.4" stroke="#FF6115" stroke-width="1.8" />
