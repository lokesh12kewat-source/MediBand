    <path d="M 1386 372 Q 1192 195 1000 270" fill="none" stroke="url(#mapArcGrad)" stroke-width="2.4" stroke-dasharray="8,5" stroke-linecap="round" />
    <path d="M 1386 372 Q 1215 210 1044 276" fill="none" stroke="url(#mapArcGrad)" stroke-width="2.2" stroke-dasharray="8,5" stroke-linecap="round" />
    <path d="M 1386 372 Q 1000 160 630 318" fill="none" stroke="url(#mapArcGrad)" stroke-width="2.6" stroke-dasharray="9,6" stroke-linecap="round" />
    <path d="M 1386 372 Q 1542 275 1698 340" fill="none" stroke="url(#mapArcGrad)" stroke-width="2.4" stroke-dasharray="8,5" stroke-linecap="round" />
    <path d="M 1386 372 Q 1452 345 1519 494" fill="none" stroke="url(#mapArcGrad)" stroke-width="2.2" stroke-dasharray="8,5" stroke-linecap="round" />
    <path d="M 1386 372 Q 1571 300 1756 651" fill="none" stroke="url(#mapArcGrad)" stroke-width="2.4" stroke-dasharray="8,5" stroke-linecap="round" />
    <path d="M 1386 372 Q 1285 330 1184 506" fill="none" stroke="url(#mapArcGrad)" stroke-width="2.2" stroke-dasharray="8,5" stroke-linecap="round" />
    <path d="M 1386 372 Q 1070 380 767 605" fill="none" stroke="url(#mapArcGrad)" stroke-width="2" stroke-dasharray="7,6" stroke-linecap="round" />
    <path d="M 1000 270 Q 815 205 630 318" fill="none" stroke="#38BDF8" stroke-width="1.8" stroke-dasharray="6,6" stroke-linecap="round" opacity="0.75" />
  </g>

