<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <title>MediBand Browser Test Harness</title>
  <script src="/node_modules/onnxruntime-web/dist/ort.min.js"></script>
</head>
<body>
  <h1>MediBand Packaging B7 Model Browser Parity Harness</h1>
  <div id="status">Loading ONNX Runtime Web...</div>
  <canvas id="canvas" style="display:none;"></canvas>

  <script>
    let session = null;
    const mean = [0.485, 0.456, 0.406];
    const std = [0.229, 0.224, 0.225];

    async function initSession() {
      try {
        ort.env.wasm.wasmPaths = '/node_modules/onnxruntime-web/dist/';
        ort.env.wasm.numThreads = 1;
        session = await ort.InferenceSession.create('/b7_fp32.onnx', {
          executionProviders: ['wasm']
        });
        document.getElementById('status').innerText = 'Model Loaded Successfully!';
        window.__modelReady = true;
        return true;
      } catch (err) {
        document.getElementById('status').innerText = 'Model Load Error: ' + err.message;
        window.__modelError = err.message;
        throw err;
      }
    }

    function loadImage(url) {
      return new Promise((resolve, reject) => {
        const img = new Image();
        img.crossOrigin = 'anonymous';
        img.onload = () => resolve(img);
        img.onerror = () => reject(new Error('Failed to load image: ' + url));
        img.src = url;
      });
    }

    // Strategy A: drawImage default
    function renderStrategyA(img) {
      const canvas = document.createElement('canvas');
      canvas.width = 288;
      canvas.height = 288;
      const ctx = canvas.getContext('2d');
      ctx.drawImage(img, 0, 0, 288, 288);
      return ctx.getImageData(0, 0, 288, 288);
    }

    // Strategy B: imageSmoothingQuality = 'high'
    function renderStrategyB(img) {
      const canvas = document.createElement('canvas');
      canvas.width = 288;
      canvas.height = 288;
      const ctx = canvas.getContext('2d');
      ctx.imageSmoothingEnabled = true;
      ctx.imageSmoothingQuality = 'high';
      ctx.drawImage(img, 0, 0, 288, 288);
      return ctx.getImageData(0, 0, 288, 288);
    }

    // Strategy C: Step-down halving until under 2x target (576 px)
    function renderStrategyC(img) {
      let curW = img.naturalWidth || img.width;
      let curH = img.naturalHeight || img.height;

      let srcCanvas = document.createElement('canvas');
      srcCanvas.width = curW;
      srcCanvas.height = curH;
      let srcCtx = srcCanvas.getContext('2d');
      srcCtx.drawImage(img, 0, 0);

      // Halve iteratively until under 2x (576px)
      while (curW > 576 || curH > 576) {
        const nextW = Math.max(288, Math.floor(curW / 2));
        const nextH = Math.max(288, Math.floor(curH / 2));
        const stepCanvas = document.createElement('canvas');
        stepCanvas.width = nextW;
        stepCanvas.height = nextH;
        const stepCtx = stepCanvas.getContext('2d');
        stepCtx.imageSmoothingEnabled = true;
        stepCtx.imageSmoothingQuality = 'high';
        stepCtx.drawImage(srcCanvas, 0, 0, nextW, nextH);

        srcCanvas = stepCanvas;
        curW = nextW;
        curH = nextH;
      }

      // Final step down to 288x288
      const finalCanvas = document.createElement('canvas');
      finalCanvas.width = 288;
      finalCanvas.height = 288;
      const finalCtx = finalCanvas.getContext('2d');
      finalCtx.imageSmoothingEnabled = true;
      finalCtx.imageSmoothingQuality = 'high';
      finalCtx.drawImage(srcCanvas, 0, 0, 288, 288);

      return finalCtx.getImageData(0, 0, 288, 288);
    }

    function imageDataToTensor(imgData) {
      const rgba = imgData.data;
      const floatData = new Float32Array(1 * 3 * 288 * 288);

      for (let y = 0; y < 288; y++) {
        for (let x = 0; x < 288; x++) {
          const pixelIdx = (y * 288 + x) * 4;
          const r = rgba[pixelIdx] / 255.0;
          const g = rgba[pixelIdx + 1] / 255.0;
          const b = rgba[pixelIdx + 2] / 255.0;

          const idxR = 0 * 288 * 288 + y * 288 + x;
          const idxG = 1 * 288 * 288 + y * 288 + x;
          const idxB = 2 * 288 * 288 + y * 288 + x;

          floatData[idxR] = (r - mean[0]) / std[0];
          floatData[idxG] = (g - mean[1]) / std[1];
          floatData[idxB] = (b - mean[2]) / std[2];
        }
      }
      return new ort.Tensor('float32', floatData, [1, 3, 288, 288]);
    }

    window.runInference = async function(imageUrl, strategy) {
      if (!session) {
        await initSession();
      }

      const img = await loadImage(imageUrl);
      let imgData = null;
      if (strategy === 'a') {
        imgData = renderStrategyA(img);
      } else if (strategy === 'b') {
        imgData = renderStrategyB(img);
      } else if (strategy === 'c') {
        imgData = renderStrategyC(img);
      } else {
        throw new Error('Unknown strategy: ' + strategy);
      }

      const tensor = imageDataToTensor(imgData);
      const feeds = { input_image: tensor };
      const output = await session.run(feeds);
      const logits = Array.from(output.logits.data);
      
      let maxLogit = -Infinity;
      let pred = -1;
      for (let i = 0; i < logits.length; i++) {
        if (logits[i] > maxLogit) {
          maxLogit = logits[i];
          pred = i;
        }
      }

      return {
        strategy: strategy,
        top1: pred,
        logits: logits
      };
    };

    window.__initPromise = initSession();
  </script>
</body>
</html>
